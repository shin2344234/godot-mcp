[plugin]

name="Godot MCP"
description="Lets an MCP (Model Context Protocol) server inspect and edit this project through the live editor. Starts a WebSocket bridge bound to 127.0.0.1 only, authenticated with a per-session token stored in .godot/godot_mcp/session.json."
author="godot-mcp contributors"
version="0.1.0"
script="plugin.gd"
