[plugin]

name="Godot MCP"
description="Editor bridge for the godot-mcp server (npm package @shin2344234/godot-mcp). It lets MCP clients such as Claude Code, Cursor or Codex inspect and edit this project through the open editor, and every scene edit goes into the undo history. Set it up with: npx -y @shin2344234/godot-mcp init. The bridge listens on 127.0.0.1 only and requires a per-session token stored in .godot/godot_mcp/session.json. See addons/godot_mcp/README.md."
author="shin2344234"
version="0.1.2"
script="plugin.gd"
